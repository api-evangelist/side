aid: side
name: Side
description: 'Side is a technology-powered residential real estate brokerage platform
  that partners with top-producing agents, teams, and independent brokers to help
  them launch and grow their own branded brokerage companies without the time, cost,
  or risk of operating a traditional brokerage. Side provides back-office operations,
  compliance, transaction management, marketing, and a proprietary Side App that
  streamlines and automates real estate transactions. Founded in San Francisco, Side
  is backed by ICONIQ Capital, Matrix Partners, Sapphire Ventures, and Trinity Ventures.
  Side runs a private, authenticated internal API (api.side.com/v1) that powers its
  app but publishes no public developer program, SDKs, or API documentation.'
